# Documentation site: build the mkdocs site from main and deploy it to GitHub Pages.
#
# The deploy job runs in the `github-pages` environment. To make every deploy wait
# for the maintainer's approval (the intended setup), in the repository settings:
#   Settings > Pages > Source: GitHub Actions
#   Settings > Environments > github-pages > Required reviewers: the maintainer
#                                          > Deployment branches: main only
# Without required reviewers a push to main deploys at once. Pull requests never
# deploy: CI's `docs` job builds the site with --strict for them.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/mkdocs_hooks.py"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false      # never stop a deploy half way

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build the site
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the documentation tools (the [docs] extra)
        run: python -m pip install -e ".[docs]"
      - name: mkdocs build --strict
        run: mkdocs build --strict --site-dir "$RUNNER_TEMP/site"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: deploy to GitHub Pages (waits for approval)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write             # deploy to Pages
      id-token: write          # prove the deploy comes from this workflow
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
