id: chip-level-abstracts
playbook: 03-chip-level-hierarchy
title: Chip-level EM/IR from block abstracts
requires: []
fixtures: [chip]
prompt: |
  Do chip-level EM/IR of VDD on inputs/chip/top.dspf from the block abstracts we already made:
  inputs/chip/adc.abstract.json is instance XADC and inputs/chip/pll.abstract.json is XPLL. XPLL sits at
  (40, 0) um with orientation R0. Both blocks run off one reference clock and their simulations start on
  the same edge. The IR budget per block is 15 mV. The process file is inputs/chip/process.yaml (the
  block DSPFs, pll.dspf and adc.dspf, and their simulation results are in inputs/chip/ too). Tell me the
  top-level verdict, each block's IR budget, and whether any block needs more work.
expect:
  commands:
    - {cmd: selftest}
    - {cmd: run, has: [--abstract, --place], value: {--align: sync, --budget-mv: 15}}
    - {cmd: abstract, has: [--port-voltages]}
  forbid:
    - {cmd: run, has: [--force]}
  documents:
    - schema: emir.run/1
      fields:
        verdict: WARN
        worst_net.ratio: {approx: 0.9091, rel: 0.001}
        hierarchy.align: sync
        hierarchy.budget.verdict: PASS
    - schema: emir.abstract/1
      fields:
        verdict: FAIL
        nets.VDDP.back_annotation.verdict: FAIL
        nets.VDDP.back_annotation.max_ratio.all: {approx: 1.00529, rel: 0.001}
  answer:
    verdict: WARN
    numbers:
      - {value: 0.909, rel: 0.01, what: top worst ratio}
      - {value: 11.5, rel: 0.01, what: XADC budget mV}
      - {value: 14.96, rel: 0.01, what: XPLL budget mV}
      - {value: 1.005, rel: 0.002, what: XPLL back-annotated ratio}
    all: ['XPLL', 'back-?annotat']
    any:
      - ['budget']
    # back_annotation.ir_drop_mV is measured from the pad (top + block): adding
    # the top-level drop again and calling the budget exceeded is the mistake
    none: ['budget[^.]*exceed', 'exceed[^.]*budget']
  limits_from: [inputs/chip/process.yaml]
reference:
  commands:
    - emir selftest --format json
    - emir pins inputs/chip/top.dspf --net VDD --format json
    - emir next --dspf inputs/chip/top.dspf --process inputs/chip/process.yaml --abstract inputs/chip/adc.abstract.json@XADC --abstract inputs/chip/pll.abstract.json@XPLL --place XPLL=40,0,R0 --align sync --format json
    - emir check inputs/chip/top.dspf --process inputs/chip/process.yaml --abstract inputs/chip/adc.abstract.json@XADC --abstract inputs/chip/pll.abstract.json@XPLL --place XPLL=40,0,R0 --align sync --format json
    - emir run inputs/chip/top.dspf --process inputs/chip/process.yaml --abstract inputs/chip/adc.abstract.json@XADC --abstract inputs/chip/pll.abstract.json@XPLL --place XPLL=40,0,R0 --align sync --budget-mv 15 --port-voltages-out emir_out/port_voltages.json --summary-out emir_out/summary.json --format json
    - emir report --from emir_out/summary.json
    - emir abstract inputs/chip/pll.dspf --process inputs/chip/process.yaml --cc-sim inputs/chip/pll.raw --mode cc-grid --period 2.5e-9 --vdd 1.0 --port-voltages emir_out/port_voltages.json@XPLL -o emir_out/pll.annotated.json --format json
  answer: |
    **Top level: WARN** on VDD (screened with both blocks black-boxed, aligned in sync). Screening, not
    sign-off.

    - Worst top-level item: the trunk Rt0 at 0.909x its limit (inside the warn margin); IR 4.0 mV at the top.
    - IR budget per block (15 mV): PASS. XADC 11.5 mV (top 4.0 + internal 7.5; exact, one pin);
      XPLL 14.96 mV (an upper bound, two pins).
    - XPLL is fed at two pins, so I back-annotated it with the top's pin voltages: its Rm1 FAILS at 1.005x
      (it read 0.952x, WARN, with its pins shorted). The current passing through the PLL between its two
      pins is what the block-alone check missed. XPLL needs a fix: widen Rm1 (or feed it from one side).
    - XADC is CLEAN on its own (0.667x).
    - The process file is the example's invented one: the limits are not a real PDK's.
