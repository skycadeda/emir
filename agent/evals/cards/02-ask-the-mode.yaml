id: ask-the-mode
playbook: 02-big-block-cc
title: Plan a simulation without choosing the mode for the person
requires: []
fixtures: [sample]
prompt: |
  I have Xyce here. inputs/rail.dspf is the RC extraction of my block's VDD rail and inputs/process.yaml
  is the process file. Plan the simulation I need to screen VDD for EM and IR, but don't run any
  simulation yet.
expect:
  disclaimer: false
  commands:
    - {cmd: selftest}
    - {cmd: next, has: [--dspf], lacks: [--mode]}
  forbid:
    # the mode is the person's choice: the agent asks, it does not pick
    - {cmd: next, has: [--mode]}
    - {cmd: save-lines}
    - {cmd: simulate}
    - {cmd: check, has: [--mode]}
    - {cmd: run, has: [--mode]}
  answer:
    all: ['rcc', 'cc-grid']
    any:
      - ['which', 'choose', 'choice', 'prefer', 'decide', 'would you like', 'do you want']
      - ['recommend', 'suggest']
    none: ['I chose', 'I picked', 'I selected', 'I went with']
reference:
  commands:
    - emir selftest --format json
    - emir next --dspf inputs/rail.dspf --process inputs/process.yaml --net VDD --sim xyce --format json
  answer: |
    Before the simulation is planned, the mode is your choice: it decides what the Xyce testbench simulates
    and saves. `emir next` lists three routes for VDD:

    - rcc: simulate the RC netlist (your DSPF, in the testbench) and read every branch current. Exact; on
      this 17-node rail it runs in seconds, so it is the one `emir next` recommends.
    - cc-grid: simulate the devices on an ideal rail (a C-only netlist) and superpose their pin currents
      through the R grid. One fast simulation that scales to big blocks; open loop, so rms and peak read
      high and the average drifts with the droop.
    - cc-grid self-consistent: cc-grid, then re-simulate with each pin fed its own droop waveform until
      the droop and the currents agree (more simulations; rms and peak come close to rcc).

    Which mode do you want? With your choice, `emir next --mode ...` plans the save lines, the Xyce run
    (`emir simulate`), the check and the screening; I also need your testbench (stimulus, models, a .tran
    over whole periods of the block's activity).
