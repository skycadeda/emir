id: pll-rcc-no-converge
playbook: 02-big-block-cc
title: The PLL top's RCC simulation does not converge - what now?
requires: []
fixtures: [pll_top]
prompt: |
  My PLL top's RCC simulation (Spectre, the RC-extracted netlist with every branch current saved) does not
  converge and takes forever. I still need EM and IR on VDD, so I want to switch to the CC route
  (cc-grid). The extraction is inputs/pll_top.dspf and the process file is inputs/process.yaml. Don't run
  any simulation; give me the exact steps, including the save lines for my testbench, whose instance of
  the PLL top is XPLL.
expect:
  disclaimer: false
  commands:
    - {cmd: selftest}
    - {cmd: next, has: [--dspf]}
    - {cmd: save-lines, value: {--mode: [cc-grid, cc]}}
  forbid:
    - {cmd: simulate}
    - {cmd: run, has: [--netlist]}
    - {cmd: save-lines, value: {--mode: rcc}}
  answer:
    all: ['cc-grid', 'R-only']
    any:
      - ['C-only', 'CC simulation', 'schematic']
      - ['PSS', 'period', 'coherent']
      - ['save-lines', 'emir_save', 'save XPLL']
reference:
  commands:
    - emir selftest --format json
    - emir next --dspf inputs/pll_top.dspf --process inputs/process.yaml --mode cc-grid --format json
    - emir save-lines inputs/pll_top.dspf --mode cc-grid --prefix XPLL. --out emir_out/emir_save.scs --format json
  answer: |
    Do not simulate the RC netlist. Screen the PLL top in cc-grid mode instead:

    1. Extract the layout twice from one LVS run: C-only (coupled) for the simulation, R-only for the grid
       (the DSPF emir solves).
    2. Save only the device-pin currents: `emir save-lines inputs/pll_top.dspf --mode cc-grid --prefix XPLL.
       --out emir_save.scs` wrote emir_out/emir_save.scs (100 pin currents); include it in the testbench.
    3. Simulate the C-only netlist (CC). For a locked integer-N PLL use PSS and its time-domain output;
       give its period to emir with --period. One simulation per operating mode.
    4. Then `emir check` and `emir run <R-only DSPF> --process inputs/process.yaml --cc-sim <result>
       --mode cc-grid --period <T> --summary-out emir_out/summary.json`, and `emir report`.

    If a supply droops more than about 2 % (give the run `--vdd`), the open-loop currents read high: the
    self-consistent route (`--mode cc-grid --self-consistent`, Spectre with the per-pin split in the CC
    netlist) re-simulates with each pin fed its own droop waveform until the droop and the currents agree --
    with your go-ahead; it brings rms and peak, as well as the average and the IR, to RCC's (what remains is
    the grid's own capacitance). Screening, not sign-off.
