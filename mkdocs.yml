# The documentation site: `pip install -e '.[docs]'`, then
#   mkdocs serve            (a local preview)
#   mkdocs build --strict   (what CI runs; warnings fail the build)
# The pages under docs/ read on GitHub as they are; scripts/mkdocs_hooks.py turns
# their links to repository files outside docs/ into links to the repository when
# `repo_url` is set below, and into plain paths when it is not.
site_name: EMIR
site_description: >-
  EM / IR-drop screening of extracted analog layout, built to be driven by AI
  agents. Screening, not sign-off.
# repo_url: REPO_URL of emir/repo.py (tests/test_repo_url.py keeps the copies
# equal): links to files outside docs/ point into the repository. site_url: where
# .github/workflows/docs.yml deploys the site (GitHub Pages).
repo_url: https://github.com/skycadeda/emir
site_url: https://skycadeda.github.io/emir/
docs_dir: docs
strict: true
exclude_docs: |
  images/*.md
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
hooks:
  - scripts/mkdocs_hooks.py
markdown_extensions:
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.superfences      # the mermaid fence is added by scripts/mkdocs_hooks.py
  - pymdownx.highlight
  - pymdownx.inlinehilite
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts: concepts.md
  - Methods and modes: method-modes.md
  - Flows:
      - Big blocks (CC + R-only): big-blocks.md
      - Chip level, hierarchically: chip-level.md
      - Simulators: simulators.md
      - Open-source flow: open-source-flow.md
      - Cadence flow: cadence.md
      - Driving EMIR from an agent: agents.md
  - PDKs and inputs:
      - Onboarding a PDK: pdk-onboarding.md
      - Process file reference: process-file-reference.md
      - DSPF requirements: dspf-requirements.md
  - Trust:
      - Validation: validation.md
      - Limits: limits.md
  - Reference:
      - Command line: cli-reference.md
      - Error codes: errors.md
      - FAQ: faq.md
      - Changelog: changelog.md
