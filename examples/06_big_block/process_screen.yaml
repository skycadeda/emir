# ILLUSTRATIVE PROCESS DATA for the screening picture of this example -- NOT A
# FOUNDRY DECK. Every number is invented and round, chosen so that a few items
# of the N = 10 mesh fail (the straps that leave the feed) and the rest pass:
# process.yaml's Metal1 limits, the contact limits doubled (with process.yaml
# every contact fails its peak limit). run.sh step 4 screens the mesh with it
# through the self-consistent loop; the README banner and the blog's cover are
# drawn from that run (scripts/make_figures.py). Point --process at your own
# PDK's file for real work.
pdk: big-block example, screening picture (illustrative)
warn_fraction: 0.8
temp_reference: 110.0      # C; the example DSPFs are extracted at 110 C too
em_tref: 110.0

layers:
  Poly:
    gds: [102, 0]          # the layer under Cont; no poly segments in the DSPFs
    sheet_res: 10.0
    min_width: 0.1
  Metal1:
    gds: [101, 0]
    sheet_res: 0.05        # ohm/square
    tc1: 0.0
    min_width: 0.1         # um
    jmax_avg: 1.0          # mA per um of width
    jmax_rms_k: 3.2        # rms limit sqrt(3.2 * delta_T) mA/um: 4.0 at 5 C
    jmax_peak: 10.0        # mA/um

vias:
  Cont:
    gds: [100, 0]
    below: Poly
    above: Metal1
    res: 10.0              # ohm per cut
    vcwidth: 0.1           # um, cut side
    imax_avg: 1.0          # mA per cut
    imax_rms: 2.0
    imax_peak: 4.0
